<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        try {
          const stored = window.localStorage.getItem('bank-dashboard-theme')
          const theme = stored === 'light' ? 'light' : 'dark'
          document.documentElement.classList.remove('dark', 'light')
          document.documentElement.classList.add(theme)
          document.documentElement.style.colorScheme = theme
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#05070b' : '#f3f6fa'
        } catch {
          /* keep the default dark theme */
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Real-time visual dashboard and control center for the Distributed Banking Platform."
    />
    <title>Distributed Banking Cluster Visualizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
