services:
  db-shard-a:
    image: postgres:15-alpine
    container_name: db-shard-a
    command: postgres -c max_prepared_transactions=100
    environment:
      POSTGRES_DB: bank_shard_a
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init_shard_a.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-shard-b:
    image: postgres:15-alpine
    container_name: db-shard-b
    command: postgres -c max_prepared_transactions=100
    environment:
      POSTGRES_DB: bank_shard_b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/init_shard_b.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-coordinator:
    image: postgres:15-alpine
    container_name: db-coordinator
    environment:
      POSTGRES_DB: coordinator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/init_coordinator.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Shard A Replicas
  bank-server-a1:
    build: ./replica
    container_name: bank-server-a1
    environment:
      REPLICA_NAME: Server-A1
      SHARD_NAME: Shard-A
      DB_HOST: db-shard-a
      DB_PORT: 5432
      DB_NAME: bank_shard_a
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8001:8000"
    depends_on:
      db-shard-a:
        condition: service_healthy

  bank-server-a2:
    build: ./replica
    container_name: bank-server-a2
    environment:
      REPLICA_NAME: Server-A2
      SHARD_NAME: Shard-A
      DB_HOST: db-shard-a
      DB_PORT: 5432
      DB_NAME: bank_shard_a
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8002:8000"
    depends_on:
      db-shard-a:
        condition: service_healthy

  # Shard B Replicas
  bank-server-b1:
    build: ./replica
    container_name: bank-server-b1
    environment:
      REPLICA_NAME: Server-B1
      SHARD_NAME: Shard-B
      DB_HOST: db-shard-b
      DB_PORT: 5432
      DB_NAME: bank_shard_b
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8003:8000"
    depends_on:
      db-shard-b:
        condition: service_healthy

  bank-server-b2:
    build: ./replica
    container_name: bank-server-b2
    environment:
      REPLICA_NAME: Server-B2
      SHARD_NAME: Shard-B
      DB_HOST: db-shard-b
      DB_PORT: 5432
      DB_NAME: bank_shard_b
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8004:8000"
    depends_on:
      db-shard-b:
        condition: service_healthy