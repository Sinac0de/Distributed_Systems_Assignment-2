version: '3.8'

services:
  db-shard-a:
    image: postgres:15-alpine
    container_name: db-shard-a
    command: postgres -c max_prepared_transactions=100
    environment:
      POSTGRES_DB: bank_shard_a
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init_shard_a.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-shard-b:
    image: postgres:15-alpine
    container_name: db-shard-b
    command: postgres -c max_prepared_transactions=100
    environment:
      POSTGRES_DB: bank_shard_b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/init_shard_b.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-coordinator:
    image: postgres:15-alpine
    container_name: db-coordinator
    environment:
      POSTGRES_DB: coordinator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/init_coordinator.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5